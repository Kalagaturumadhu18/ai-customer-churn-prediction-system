{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ChurnIQ{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'churn/style.css' %}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">C</span> ChurnIQ</a>
  <nav><a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'upload_csv' %}">Upload CSV</a><a href="{% url 'results' %}">Results</a></nav>
</header>
<main class="container">
  {% if messages %}<div class="messages">{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
  <footer>ChurnIQ · Machine Learning demonstration · Synthetic demo data</footer>
</main>
</body></html>
